frontend:
  name: dashboard-mfe
  replicaCount: 1
  image:
    repository: mfe-pot-dashboard-mfe
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # dashboardBffBaseUrl is same-origin (this app's own BFF, via
  # the /api Ingress path rule below) -- see CLAUDE.md's Hosting section.
  # Empty, not "/api": HttpBenefitOverviewApiClient/HttpPaymentHistoryApiClient
  # already append "/api/..." themselves (`${baseUrl}/api/overview`), so
  # this value is just "this app's own origin" -- shared-runtime-config's
  # fetchRuntimeConfig resolves "" to that origin. A literal "/api" here
  # double-prefixes every request to /api/api/... and 404s.
  # strapiBaseUrl now points at charts/strapi's real public Ingress
  # hostname (mfe-pot-platform), not in-cluster Service DNS -- this call
  # is browser-to-server (ContentClient fetches Strapi directly from the
  # end user's browser, same as shell's federation-manifest fetch), so a
  # cluster-internal name would never resolve there even once the chart
  # existed.
  runtimeConfig:
    dashboardBffBaseUrl: ""
    strapiBaseUrl: "http://cms.mfe-pot.local"
    # Browser-reachable Ingress host, not in-cluster Service DNS (contrast
    # with backend.env's OTEL_EXPORTER_OTLP_ENDPOINT below) -- see
    # mfe-pot-platform/charts/otel-collector.
    otelExporterOtlpEndpoint: "http://otel.mfe-pot.local"

backend:
  name: dashboard-bff
  replicaCount: 1
  image:
    repository: mfe-pot-dashboard-bff
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3004
  servicePort: 3004
  # JOB_BANK_BFF_URL/EMPLOYMENT_INSURANCE_BFF_URL point at real sibling
  # Helm releases' in-cluster Services (job-bank-bff, employment-insurance-bff
  # -- each already a Deployment+Service pair from its own extracted
  # repo's chart), not their public Ingress hostnames -- this is genuine
  # cluster-internal service-to-service traffic. Payments/correspondence are
  # served from dashboard-bff's own local data (data.ts), so /api/payments
  # and /api/overview's payments/correspondence tiles no longer depend on
  # any upstream being deployed.
  # REDIS_URL points at mfe-pot-platform's charts/session-cache release --
  # a third, separate cross-Helm-release in-cluster Service, same kind of
  # traffic as the two BFF URLs above.
  # MOCK_IDP_JWKS_URL/MOCK_IDP_ISSUER point at mfe-pot-platform's
  # charts/mock-idp release's own in-cluster Service DNS -- server-to-server
  # JWT verification traffic, same pattern as the other cross-Helm-release
  # URLs below. MOCK_IDP_ISSUER must match mock-idp's own chart value
  # exactly (it's the `iss` claim mock-idp bakes into every token).
  env:
    HOST: "0.0.0.0"
    PORT: "3004"
    JOB_BANK_BFF_URL: "http://job-bank-bff.default.svc.cluster.local:3001"
    EMPLOYMENT_INSURANCE_BFF_URL: "http://employment-insurance-bff.default.svc.cluster.local:3002"
    REDIS_URL: "redis://session-cache.default.svc.cluster.local:6379"
    MOCK_IDP_JWKS_URL: "http://mock-idp.default.svc.cluster.local:3005/.well-known/jwks.json"
    MOCK_IDP_ISSUER: "http://mock-idp.default.svc.cluster.local:3005"
    # otel-collector is a separate Helm release in mfe-pot-platform (see its
    # charts/otel-collector), same cross-Helm-release in-cluster Service DNS
    # pattern as REDIS_URL above -- identical on kind and EKS.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.default.svc.cluster.local:4318"
    OTEL_SERVICE_NAME: "dashboard-bff"

ingress:
  host: dashboard-mfe.mfe-pot.local
  className: nginx
  # TLS is off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
