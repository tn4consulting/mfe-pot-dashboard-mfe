frontend:
  name: dashboard-mfe
  # Generalizing the pattern proved live on employment-insurance-mfe --
  # see mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  # Local kind default stays at 1 (limits resource pressure on a
  # single-node dev cluster). EKS stays at 1 too now -- the real
  # cluster's 2 t3.medium nodes cap at 17 pods each (AWS VPC CNI ENI/IP
  # limit, not CPU/memory), and doubling replicas across the family blew
  # past that -- confirmed live (FailedScheduling: "Too many pods").
  # See mfe-pot/TODO.md's "Design principles" section.
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  image:
    repository: mfe-pot-dashboard-mfe
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # dashboardBffBaseUrl is same-origin (this app's own BFF, via
  # the /api Ingress path rule below) -- see CLAUDE.md's Hosting section.
  # Empty, not "/api": HttpPaymentHistoryApiClient already appends
  # "/api/..." itself (`${baseUrl}/api/payments`), so this value is just
  # "this app's own origin" -- shared-runtime-config's fetchRuntimeConfig
  # resolves "" to that origin. A literal "/api" here double-prefixes every
  # request to /api/api/... and 404s.
  # strapiBaseUrl now points at charts/strapi's real public Ingress
  # hostname (mfe-pot-platform), not in-cluster Service DNS -- this call
  # is browser-to-server (ContentClient fetches Strapi directly from the
  # end user's browser, same as shell's federation-manifest fetch), so a
  # cluster-internal name would never resolve there even once the chart
  # existed.
  runtimeConfig:
    dashboardBffBaseUrl: ""
    strapiBaseUrl: "http://cms.mfe-pot.local"
    # Browser-reachable Ingress host, not in-cluster Service DNS (contrast
    # with backend.env's OTEL_EXPORTER_OTLP_ENDPOINT below) -- see
    # mfe-pot-platform/charts/otel-collector.
    otelExporterOtlpEndpoint: "http://otel.mfe-pot.local"
    # Unleash's own Frontend API, browser-reachable -- see
    # mfe-pot-platform/charts/unleash. Gates the job-applications/
    # ei-reporting-status cross-domain widgets on Overview.tsx (see
    # mfe-pot/TODO.md's "Design principles" section, principle 6). The
    # token is a FRONTEND-type Unleash token, not the CLIENT-type token
    # dashboard-bff would use if it read flags -- see
    # charts/unleash/values.yaml's comment on why these aren't
    # interchangeable.
    unleashFrontendApiUrl: "http://unleash.mfe-pot.local/api/frontend"
    unleashFrontendApiToken: "*:development.unleash-demo-frontend-token"

backend:
  name: dashboard-bff
  # 1 on both kind and EKS -- see frontend.replicaCount's comment above.
  replicaCount: 1
  readinessPath: /ready
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  image:
    repository: mfe-pot-dashboard-bff
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3004
  servicePort: 3004
  # dashboard-bff never calls another BFF (see mfe-pot/TODO.md's "Design
  # principles" section, principle 2) -- payments/correspondence are served
  # entirely from its own local data (data.ts). It used to also proxy
  # job-bank-bff/employment-insurance-bff (JOB_BANK_BFF_URL/
  # EMPLOYMENT_INSURANCE_BFF_URL, feeding the now-deleted /api/overview);
  # that cross-domain content is composed in the browser instead now, via
  # the widget-loader (see dashboard-mfe's Overview.tsx).
  # REDIS_URL points at mfe-pot-platform's charts/session-cache release --
  # a cross-Helm-release in-cluster Service, same kind of traffic as
  # MOCK_IDP_JWKS_URL/MOCK_IDP_ISSUER below.
  # MOCK_IDP_JWKS_URL/MOCK_IDP_ISSUER point at mfe-pot-platform's
  # charts/mock-idp release's own in-cluster Service DNS -- server-to-server
  # JWT verification traffic, same pattern as the other cross-Helm-release
  # URLs below. MOCK_IDP_ISSUER must match mock-idp's own chart value
  # exactly (it's the `iss` claim mock-idp bakes into every token).
  env:
    HOST: "0.0.0.0"
    PORT: "3004"
    REDIS_URL: "redis://session-cache.default.svc.cluster.local:6379"
    MOCK_IDP_JWKS_URL: "http://mock-idp.default.svc.cluster.local:3005/.well-known/jwks.json"
    MOCK_IDP_ISSUER: "http://mock-idp.default.svc.cluster.local:3005"
    # otel-collector is a separate Helm release in mfe-pot-platform (see its
    # charts/otel-collector), same cross-Helm-release in-cluster Service DNS
    # pattern as REDIS_URL above -- identical on kind and EKS.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.default.svc.cluster.local:4318"
    OTEL_SERVICE_NAME: "dashboard-bff"

ingress:
  host: dashboard-mfe.mfe-pot.local
  className: nginx
  # TLS is off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
